server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Adresa reală a clientului, pentru limitele de cereri ale PocketBase: în fața lui nginx este Traefik (rețea
    # privată), care adaugă adresa clientului la X-Forwarded-For. Se ia ultima adresă care nu e din rețeaua privată,
    # deci un client nu își poate falsifica adresa trimițând el însuși antetul.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fișierele din assets/ au hash în nume: se pot păstra în cache la nesfârșit.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker-ul și shell-ul trebuie revalidate mereu, altfel actualizările PWA nu ajung la utilizatori.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Sincronizarea (Faza 6): cererile spre /api/ merg la PocketBase, pe rețeaua internă din compose.
    # Adresa se rezolvă la cerere (variabilă + resolver din 40-resolver.sh), ca nginx să pornească și dacă PocketBase nu rulează:
    # atunci /api/ răspunde 502, iar aplicația funcționează normal fără cont.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        include /tmp/nginx-resolver.conf;
        set $pocketbase http://pocketbase:8090;
        proxy_pass $pocketbase;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }

    # Panoul de administrare PocketBase nu se expune public (se deschide printr-un tunel SSH, vezi README).
    location /_/ {
        return 404;
    }

    # Iconițe și alte fișiere statice fără hash.
    location /icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Fallback SPA pentru rutele react-router (ex. /sesiune, /statistici).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
