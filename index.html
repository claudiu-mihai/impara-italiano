<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#009246" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Impara l'italiano con Lupino</title>
    <!-- numele de sub iconiță pe iPhone (pe Android îl dă short_name din manifest) -->
    <meta name="apple-mobile-web-app-title" content="Lupino" />
    <script>
      // Aplică tema aleasă înainte de prima afișare, ca să nu apară un „flash” luminos.
      try {
        var t = localStorage.getItem("impara.theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
